
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MechCAD</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #151a22;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 16px;
  background: #222b38;
  font-size: 22px;
  font-weight: bold;
}
.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  flex-wrap: wrap;
}
button {
  background: #34445a;
  color: white;
  border: 1px solid #52647c;
  padding: 11px 15px;
  border-radius: 7px;
}
#viewport {
  height: 72vh;
  width: 100%;
  touch-action: none;
}
footer {
  padding: 12px;
  color: #aab6c7;
  font-size: 13px;
}
</style>
</head>
<body>

<header>MechCAD</header>

<div class="toolbar">
  <button id="cube">Add Cube</button>
  <button id="reset">Reset View</button>
</div>

<div id="viewport"></div>

<footer>
  Android CAD Workspace | Version 0.1
</footer>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const container = document.getElementById('viewport');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151a22);

const camera = new THREE.PerspectiveCamera(
  45, container.clientWidth / container.clientHeight, 0.1, 1000
);
camera.position.set(5, 5, 7);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.GridHelper(20, 20));

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 7);
scene.add(light);

const material = new THREE.MeshStandardMaterial({
  color: 0x2694e8,
  metalness: 0.25,
  roughness: 0.45
});

const geometry = new THREE.BoxGeometry(2, 2, 2);
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

document.getElementById('cube').onclick = () => {
  const newCube = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    material.clone()
  );
  newCube.position.set(
    Math.random() * 3,
    0.5,
    Math.random() * 3
  );
  scene.add(newCube);
};

document.getElementById('reset').onclick = () => {
  camera.position.set(5, 5, 7);
  controls.target.set(0, 0, 0);
  controls.update();
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>
